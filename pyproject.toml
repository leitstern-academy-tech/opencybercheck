[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencybercheck"
version = "0.1.0"
description = "Open-source cybersecurity assessment and remediation toolkit for European SMEs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Leitstern Academy & Technology GmbH", email = "info@lsacademytech.com" }
]
keywords = [
  "cybersecurity",
  "security-assessment",
  "risk-assessment",
  "sme",
  "open-source"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security"
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.urls]
Homepage = "https://github.com/leitstern-academy-tech/opencybercheck"
Repository = "https://github.com/leitstern-academy-tech/opencybercheck"
Issues = "https://github.com/leitstern-academy-tech/opencybercheck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
